<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="redline-title">
  <title id="redline-title">Redline</title>
  <defs>
    <linearGradient id="redline-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29292d"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <filter id="redline-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="72" y="72" width="880" height="880" rx="204" fill="url(#redline-background)" filter="url(#redline-shadow)"/>
  <!-- Gauge dial: centre (512, 650), radius 310, stroke 64. The track runs 155deg
       to 25deg and the redline runs 48deg to 25deg on the same circle, so the two
       are flush segments of one 130deg arc. -->
  <path d="M231 519 A310 310 0 0 1 793 519" fill="none" stroke="#f7f7f8" stroke-width="64" stroke-linecap="round" opacity=".95"/>
  <path d="M719.4 419.6 A310 310 0 0 1 793 519" fill="none" stroke="#ef3f45" stroke-width="64" stroke-linecap="round"/>
  <!-- Graduation notches, radial to the same centre. Endpoints sit at r 287 and
       333 so the 9-unit round caps land exactly on the 278..342 stroke band
       instead of bleeding past its edges. -->
  <g stroke="#111114" stroke-width="18" stroke-linecap="round" opacity=".75">
    <path d="M276.9 485.4 L239.2 459"/>
    <path d="M390.7 389.9 L371.3 348.2"/>
    <path d="M633.3 389.9 L652.7 348.2"/>
    <path d="M747.1 485.4 L784.8 459"/>
  </g>
  <!-- Needle pivots on the dial centre at 55deg, just short of the 48deg-25deg
       redline segment: approaching the limit rather than past it. -->
  <path d="M487.4 632.8 L656.5 443.6 L536.6 667.2 Z" fill="#f7f7f8"/>
  <circle cx="512" cy="650" r="62" fill="#f7f7f8"/>
  <circle cx="512" cy="650" r="26" fill="#ef3f45"/>
</svg>
