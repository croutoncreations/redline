session_name: Redline - jf-fix-mobile-dash
start_directory: /Users/jfox/projects/redline/.worktrees/jf-fix-mobile-dash
suppress_history: false
options:
  base-index: 1
  automatic-rename: "off"
  mouse: on
  status: on
  status-interval: 5
  status-left-length: 60
  status-right-length: 120
  status-left: '#[bold]Redline - #{session_name}#[default] | #{window_index}:#{window_name}'
  status-right: '#{pane_current_path} | %Y-%m-%d %H:%M'
window_options:
  window-status-format: ' #{window_index}:#{window_name} '
  window-status-current-format: ' #[reverse]#{window_index}:#{window_name}#[default] '
windows:
  - window_name: agent
    layout: tiled
    shell_command_before:
      - cd /Users/jfox/projects/redline/.worktrees/jf-fix-mobile-dash
      - export API=55821
      - export SESSION_NAME=jf-fix-mobile-dash
    panes:
      - pi -c

  - window_name: codex
    layout: tiled
    shell_command_before:
      - cd /Users/jfox/projects/redline/.worktrees/jf-fix-mobile-dash
      - export API=55821
      - export SESSION_NAME=jf-fix-mobile-dash
    panes:
      - codex resume --last || codex

  - window_name: service
    layout: main-horizontal
    shell_command_before:
      - cd /Users/jfox/projects/redline/.worktrees/jf-fix-mobile-dash
      - export API=55821
      - export SESSION_NAME=jf-fix-mobile-dash
      - export REDLINE_DEV_API=http://127.0.0.1:$API
    panes:
      - pane_name: api
        shell_command: /Users/jfox/projects/redline/.worktrees/jf-fix-mobile-dash/.devx/start_service.sh
      - pane_name: shell
        shell_command: >-
          echo "API: $REDLINE_DEV_API" &&
          echo "Health: go run ./cmd/redline --config .devx/redline.dev.yaml --api $REDLINE_DEV_API health" &&
          echo "Dashboard: .devx/open_dashboard.sh" &&
          bash

  - window_name: tests
    layout: tiled
    shell_command_before:
      - cd /Users/jfox/projects/redline/.worktrees/jf-fix-mobile-dash
      - export API=55821
      - export SESSION_NAME=jf-fix-mobile-dash
    panes:
      - echo 'Go checks: test -z "$(gofmt -l .)" && go vet ./... && go test -race ./...' && bash
      - echo 'macOS checks: swift test --package-path macos' && bash
      - echo 'Dashboard checks: npm ci && npm run test:dashboard' && bash
