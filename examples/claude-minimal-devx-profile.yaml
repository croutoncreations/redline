id: claude-minimal-devx
provider_account_id: claude-main
harness_type: claude-code
model: haiku
harness_args:
  - --safe-mode
  - --tools
  - ""
  - --no-session-persistence
workspace_provider: devx
workspace_args:
  - --target
  - host
repository: /absolute/path/to/repository
base_branch: main
cleanup_policy: always
