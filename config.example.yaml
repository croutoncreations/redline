database: redline.db
run_artifacts_dir: .redline/runs
active_policy: standard
max_snapshot_age: 15m

# Optional HTTPS hostnames accepted through a trusted reverse proxy such as
# Tailscale Serve. Exact matches only; do not include schemes, ports, or wildcards.
api:
  trusted_hosts: []
  # trusted_hosts:
  #   - macbook-pro.example.ts.net

# Automatic dispatch is opt-in so installing or upgrading Redline cannot start
# spending subscription capacity unexpectedly.
scheduler:
  enabled: false
  poll_interval: 5m

# Read-only monitoring is independent of automatic dispatch. It periodically
# correlates Redline's own run token counts with OpenUsage percentage
# snapshots to estimate allowance sizes; it does not require any external
# tooling.
usage_monitor:
  enabled: true
  poll_interval: 5m

# Set enabled: true to record notifications. Use command: "" (or omit it) for
# native Mac alerts without an external hook; authorize notifications in the app.
# When set, command is a trusted local hook receiving event JSON on stdin.
# Try: redline notification test --event all (requires enabled: true).
notifications:
  enabled: false
  command: ./scripts/redline-notify
  timeout: 30s
  events: [run.started, run.completed, run.failed, scheduler.error, reset.expiring, reset.redeemed, reset.redeem_failed, firesale.started, firesale.ended]

providers:
  codex-main:
    provider: codex
    # The banked_resets options shown under claude-main apply to Codex too.
    # Optional provider default. If omitted, active_policy is used. A dashboard
    # override takes precedence and is persisted in SQLite until reset.
    # policy: standard
    # Safe default is one active run. Raise this to admit independent jobs in
    # parallel; optional pool limits can be stricter than the provider cap.
    # max_concurrent_runs: 2
    # Optional higher provider cap during firesale (pool/runtime caps still apply).
    # firesale_max_concurrent_runs: 3
    # pool_concurrency:
    #   weekly: 2
    # auto prefers a healthy local OpenUsage API and falls back to Redline's
    # native collector after repeated failures. Use openusage or native to pin.
    usage_source: auto
    openusage_url: http://127.0.0.1:6736
    # Bootstrap fallback. Redline learns an observed ratio when a 5-hour
    # window is present and enough paired snapshot history is available.
    window_weekly_cost: 0.10
  claude-main:
    provider: claude
    usage_source: auto
    openusage_url: http://127.0.0.1:6736
    # One full 5-hour allowance expressed as a fraction of the weekly limit.
    window_weekly_cost: 0.08
    # Banked-reset reminders require notifications.enabled (defaults shown).
    # banked_resets:
    #   remind_before: [24h] # [] disables reminders, not the expiry action
    #   on_expiry: notify   # off | notify | redeem (opt-in; needs usage_monitor.enabled)
    #   redeem_lead: 1h
    # Before enabling redeem: dry run, then a manual first redemption.
    # Requires usage_monitor.enabled; redemption ignores dispatch pause to avoid losing resets.
    # Redeemable weekly resets shorten the scheduling horizon; retries respect cooldowns/429s.
    # Example: allow two Claude runs, but never overlap two Fable runs.
    # max_concurrent_runs: 2
    # firesale_max_concurrent_runs: 3
    # pool_concurrency:
    #   model:fable:weekly: 1
    # Optional explicit aliases. These are the built-in Claude defaults and may
    # be extended when new Fable model identifiers appear.
    model_groups:
      fable:
        aliases: [fable, claude-fable-5, claude-fable-latest]

policies:
  late:
    trigger_margin: 0.05
    rolling_reserve: 0.40
    pace_thresholds:
      - { time_remaining: 24h, min_weekly_remaining: 0.50 }
  standard:
    trigger_margin: 0.02
    rolling_reserve: 0.25
    pace_gap_trigger: 0.30
    firesale_trigger: 0.45
    pace_thresholds:
      - { time_remaining: 72h, min_weekly_remaining: 0.50 }
      - { time_remaining: 24h, min_weekly_remaining: 0.20 }
  early:
    trigger_margin: 0.00
    rolling_reserve: 0.10
    pace_gap_trigger: 0.15
    firesale_trigger: 0.35
    pace_thresholds:
      - { time_remaining: 120h, min_weekly_remaining: 0.50 }
      - { time_remaining: 72h, min_weekly_remaining: 0.30 }
      - { time_remaining: 24h, min_weekly_remaining: 0.10 }
