<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="color-scheme" content="dark light">
  <title>Pair Redline</title>
  <link rel="stylesheet" href="/assets/mobile/mobile.css">
</head>
<body class="m-pair-page">
  <main class="m-pair-shell">
    <div class="m-pair-brand"><span class="m-mark" aria-hidden="true"><i></i></span> REDLINE</div>
    <h1>Pair this browser</h1>
    <p>This grants this browser access to your local Redline service. Continue only if you generated this QR code on your Mac.</p>
    <button id="pair-button" class="m-btn primary" type="button">Pair this browser</button>
    <div id="pair-status" class="m-pair-status" role="status" aria-live="polite"></div>
  </main>
  <script src="/assets/mobile/pair.js" defer></script>
</body>
</html>
