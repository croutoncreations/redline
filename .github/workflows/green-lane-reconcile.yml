name: Green Lane Reconcile

on:
  # GitHub exposes thread resolve/unresolve as webhooks, not Actions events.
  # Reconcile from trusted main without ever executing PR code.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read

concurrency:
  group: green-lane-reconcile
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      pull-requests: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/github-script@v7
        id: plan
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {...context.repo, state:'open', per_page:100});
            const numbers = prs.map(pr => pr.number).sort((a,b) => a-b);
            if (numbers.some(n => !Number.isSafeInteger(n) || n <= 0) || new Set(numbers).size !== numbers.length) throw new Error('Invalid open PR list');
            const shards = [];
            for (let i=0; i<numbers.length; i+=5) shards.push(numbers.slice(i,i+5));
            if (shards.length > 256) throw new Error('More than 256 reconciliation shards; expand the planning strategy');
            core.setOutput('shards', JSON.stringify(shards));
  evaluate:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        prs: ${{ fromJSON(needs.plan.outputs.shards) }}
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.plan.outputs.shards != '[]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build trusted evaluator
        run: go build -o "$RUNNER_TEMP/green-lane-check" ./cmd/green-lane-check
      - name: Reconcile open PRs
        uses: actions/github-script@v7
        env:
          RECONCILE_PR_NUMBERS: ${{ toJSON(matrix.prs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          script: |
            await require('./.github/green-lane/reconcile.cjs')({github, context, core});
      - name: Upload evaluations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-lane-reconciliation-${{ github.run_id }}-${{ strategy.job-index }}
          path: evaluation-*.json
          if-no-files-found: ignore
          retention-days: 30
