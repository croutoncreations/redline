name: Green Lane Shadow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: write

# SHADOW MODE ONLY. Nothing in this workflow merges, approves, labels or
# enables auto-merge, and it must stay that way until the pre-enable checklist
# in docs/green-lane-shadow.md is complete.
#
# The green-lane-shadow check concludes "success" when a PR WOULD merge. It is
# a report, not a gate: never make it a required status check or add it to a
# branch protection rule or ruleset. Its check run is posted by
# github-actions, not a pinned App, so anyone who can run a workflow could
# fake it.

jobs:
  # Runs the planned tests. This job executes PR code (the PR's tests on the
  # merge-base, and the PR head), so it has a read-only token, no secrets, and
  # produces evidence only. It never decides the repro verdict.
  repro:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.pr_info.outputs.head_sha }}
      base_sha: ${{ steps.pr_info.outputs.base_sha }}
      number: ${{ steps.pr_info.outputs.number }}

    steps:
      - name: Get PR info
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            let pr_data;

            if (context.eventName === 'workflow_run') {
              const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.payload.workflow_run.head_sha
              });

              if (prs.data.length === 0) {
                core.setFailed('No PR found for workflow run');
                return;
              }

              pr_data = prs.data[0];
            } else {
              pr_data = context.payload.pull_request;
            }

            core.setOutput('head_sha', pr_data.head.sha);
            core.setOutput('base_sha', pr_data.base.sha);
            core.setOutput('number', pr_data.number);
            return pr_data.number;

      # Trusted code first: the runner binary is built from the base commit
      # before any PR code is on disk.
      - name: Check out trusted base code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.sha || github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: trusted/go.mod
          cache: false

      - name: Build repro runner from trusted code
        working-directory: trusted
        run: go build -o "$RUNNER_TEMP/green-lane-repro" ./cmd/green-lane-repro-analyze

      - name: Check out PR
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_info.outputs.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Plan and run repro tests
        env:
          BASE_SHA: ${{ steps.pr_info.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p repro-results
          "$RUNNER_TEMP/green-lane-repro" plan -repo pr -base "$BASE_SHA" -head "$HEAD_SHA" -out repro-results/plan.json
          "$RUNNER_TEMP/green-lane-repro" run -repo pr -plan repro-results/plan.json -out repro-results

      - name: Upload raw repro results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-raw-${{ github.run_id }}
          path: repro-results/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  # Scores the repro. Built and run from trusted base code; it recomputes the
  # plan from git objects itself and never executes PR code, so a PR cannot
  # change which tests count or how their results are judged.
  repro-analyze:
    runs-on: ubuntu-latest
    needs: repro
    if: always() && needs.repro.result != 'skipped' && needs.repro.outputs.head_sha != ''
    permissions:
      contents: read
    outputs:
      pass: ${{ steps.analyze.outputs.pass }}
      inconclusive: ${{ steps.analyze.outputs.inconclusive }}
      message: ${{ steps.analyze.outputs.message }}
      test_ids: ${{ steps.analyze.outputs.test_ids }}

    steps:
      - name: Check out trusted base code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.sha || github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: trusted/go.mod
          cache: false

      - name: Build repro analyzer from trusted code
        working-directory: trusted
        run: go build -o "$RUNNER_TEMP/green-lane-repro" ./cmd/green-lane-repro-analyze

      # Git objects only: used to recompute the plan, never built or run.
      - name: Check out PR history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.repro.outputs.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Download raw repro results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: repro-raw-${{ github.run_id }}
          path: repro-results

      - name: Analyze repro results
        id: analyze
        env:
          BASE_SHA: ${{ needs.repro.outputs.base_sha }}
          HEAD_SHA: ${{ needs.repro.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p repro-results
          # Ignore the plan from the job that ran PR code; recompute it here.
          "$RUNNER_TEMP/green-lane-repro" plan -repo pr -base "$BASE_SHA" -head "$HEAD_SHA" -out trusted-plan.json
          "$RUNNER_TEMP/green-lane-repro" analyze -plan trusted-plan.json -results repro-results \
            -evidence repro-evidence.json -base-output base_failure_output.txt >> "$GITHUB_OUTPUT"

      - name: Upload repro evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-evidence-${{ needs.repro.outputs.number }}-${{ github.run_id }}
          path: |
            trusted-plan.json
            repro-evidence.json
            base_failure_output.txt
          if-no-files-found: ignore
          retention-days: 30

  evaluate:
    runs-on: ubuntu-latest
    needs: [repro, repro-analyze]
    # checks: write is only for posting the report-only green-lane-shadow
    # check run. This job builds and runs trusted base-branch code only.
    permissions:
      contents: read
      pull-requests: read
      checks: write
    if: |
      always() && (
        github.event_name == 'pull_request' || 
        github.event_name == 'pull_request_review' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
      )
    
    steps:
      # Check out an exact, trusted commit. A workflow_run can start after the
      # PR was merged and its branch deleted, so a branch name may no longer
      # exist; github.sha is the default-branch commit this workflow runs at.
      # For pull_request events the evaluator comes from the base commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.sha || github.event.pull_request.base.sha }}
          persist-credentials: false
      
      # No cache: the repro job runs PR code in this same workflow run and
      # cache scope, and code on a hosted runner can obtain the Actions
      # runtime token and save an entry under setup-go's predictable key. A
      # restored Go build cache would then feed into the evaluator binary.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      
      - name: Build evaluator
        run: go build -o green-lane-check ./cmd/green-lane-check
      
      - name: Get PR number and info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let pr_number, pr_data;
            
            if (context.eventName === 'workflow_run') {
              // Get PRs associated with the workflow run's head SHA
              const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.payload.workflow_run.head_sha
              });
              
              if (prs.data.length === 0) {
                console.log('No PR found for workflow run');
                return;
              }
              
              pr_data = prs.data[0];
              pr_number = pr_data.number;
            } else {
              pr_number = context.payload.pull_request.number;
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr_number
              });
              pr_data = pr.data;
            }
            
            core.setOutput('number', pr_number);
            core.setOutput('head_sha', pr_data.head.sha);
            core.setOutput('base_ref', pr_data.base.ref);
            return pr_number;
      
      - name: Create check run
        id: check
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const head_sha = process.env.HEAD_SHA;
            if (!head_sha) {
              core.setFailed('No PR found to evaluate');
              return;
            }
            
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'green-lane-shadow',
              head_sha: head_sha,
              status: 'in_progress',
              output: {
                title: 'Green Lane Shadow Evaluation',
                summary: 'Evaluating PR against green-lane rules...'
              }
            });
            core.setOutput('check_id', check.data.id);
            return check.data.id;
      
      # The docs/deps lane ignores these; the code lane requires pass=true.
      # A missing analyzer result (job failed or skipped) is inconclusive.
      - name: Set repro environment variables
        id: repro_env
        env:
          REPRO_INCONCLUSIVE_OUT: ${{ needs.repro-analyze.outputs.inconclusive }}
          REPRO_PASS_OUT: ${{ needs.repro-analyze.outputs.pass }}
          REPRO_MESSAGE_OUT: ${{ needs.repro-analyze.outputs.message }}
          REPRO_TEST_IDS_OUT: ${{ needs.repro-analyze.outputs.test_ids }}
        run: |
          if [ -z "$REPRO_PASS_OUT" ] && [ -z "$REPRO_INCONCLUSIVE_OUT" ]; then
            echo "REPRO_INCONCLUSIVE=true" >> "$GITHUB_ENV"
            echo "REPRO_MESSAGE=No repro analyzer result (repro jobs failed or were skipped)" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "REPRO_PASS=$REPRO_PASS_OUT"
            echo "REPRO_INCONCLUSIVE=$REPRO_INCONCLUSIVE_OUT"
            echo "REPRO_MESSAGE<<__REPRO_EOF_${GITHUB_RUN_ID}__"
            printf '%s\n' "$REPRO_MESSAGE_OUT"
            echo "__REPRO_EOF_${GITHUB_RUN_ID}__"
            echo "REPRO_TEST_IDS<<__REPRO_IDS_EOF_${GITHUB_RUN_ID}__"
            printf '%s\n' "$REPRO_TEST_IDS_OUT"
            echo "__REPRO_IDS_EOF_${GITHUB_RUN_ID}__"
          } >> "$GITHUB_ENV"

      - name: Run evaluation
        id: eval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          ./green-lane-check > result.json || true
          echo "result_file=result.json" >> "$GITHUB_OUTPUT"
      
      - name: Parse result and update check
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ steps.check.outputs.check_id }}
        with:
          script: |
            const fs = require('fs');
            
            // Values reach the script through env: an inline expression for a
            // skipped step renders as nothing and breaks the JavaScript.
            const checkId = Number(process.env.CHECK_ID);
            if (!checkId) {
              core.warning('No green-lane-shadow check run was created (an earlier step failed or found no PR); nothing to update.');
              return;
            }
            
            let result;
            try {
              const content = fs.readFileSync('result.json', 'utf8');
              result = JSON.parse(content);
            } catch (error) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: checkId,
                status: 'completed',
                conclusion: 'failure',
                output: {
                  title: 'Green Lane Shadow Evaluation Failed',
                  summary: 'Failed to evaluate PR: ' + error.message
                }
              });
              throw error;
            }
            
            // Build output
            let summary = `# ${result.verdict === 'would_merge' ? '✅' : '❌'} ${result.verdict.replace('_', ' ').toUpperCase()}\n\n`;
            summary += `**PR #${result.pr_number}**\n`;
            summary += `**Head SHA:** \`${result.head_sha}\`\n`;
            summary += `**Evaluated at:** ${result.evaluated_at}\n\n`;
            
            summary += '## Rule Results\n\n';
            for (const rule of result.rules) {
              let status = rule.pass ? '✅ PASS' : (rule.inconclusive ? '⚠️ INCONCLUSIVE' : '❌ FAIL');
              summary += `### ${status}: ${rule.name}\n`;
              summary += `${rule.message}\n\n`;
            }
            
            summary += '## Summary\n\n';
            summary += result.summary + '\n\n';
            
            if (result.verdict === 'would_merge') {
              summary += '---\n\n';
              summary += '✨ **This PR would be merged automatically if green-lane were live.**\n\n';
              summary += 'Shadow mode: no action taken. The real gate App, cross-vendor reviewer Apps, ';
              summary += 'and provenance infrastructure do not exist yet.\n';
            } else {
              summary += '---\n\n';
              summary += '⏸️ **This PR would NOT be merged and would wait for manual review.**\n';
            }
            
            // Save result as artifact
            const artifactContent = JSON.stringify(result, null, 2);
            fs.writeFileSync('evaluation-result.json', artifactContent);
            
            // Update check run
            const conclusion = result.verdict === 'would_merge' ? 'success' : 'neutral';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkId,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: `Green Lane Shadow: ${result.verdict.replace('_', ' ')}`,
                summary: summary
              }
            });
      
      - name: Upload evaluation artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: green-lane-evaluation-${{ steps.pr.outputs.number }}-${{ github.run_id }}
          path: evaluation-result.json
          retention-days: 30
