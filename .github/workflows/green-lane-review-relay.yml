name: Green Lane Review Relay

on:
  workflow_run:
    workflows: ["Green Lane Shadow"]
    types: [completed]

# Dispatch only: no merge, approval, check publishing, or PR checkout.
permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: green-lane-review-relay-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  relay:
    if: >-
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.workflow_id == 379979062 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/green-lane/review-relay.cjs')({github,context});
