name = "redline-relay"
main = "src/index.js"
compatibility_date = "2025-08-01"

# The relay forwards frames it cannot read. It holds no user data, so there is
# nothing here to protect beyond the entitlement public key, which is public by
# construction.

# custom_domain rather than a route pattern: this subdomain exists only to
# serve the relay, so Cloudflare should own its DNS record and certificate
# outright instead of us hanging a pattern off an existing record.
[[routes]]
pattern = "redline-relay.croutoncreations.com"
custom_domain = true

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "RelaySession"

# SQLite-backed is required on the Workers free plan, and is the recommended
# backend for all new classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelaySession"]

[vars]
# Ed25519 public key (base64, raw 32 bytes) of the entitlement issuer.
#
# A public key is public by construction: it can verify a signature and cannot
# create one, so committing it gives an attacker nothing. The private half has
# never been in this repo and belongs in a Cloudflare secret once the issuer
# service exists.
#
# Rotating this key invalidates every token in circulation at once, which is
# the break-glass revocation the short-expiry design otherwise avoids needing.
ENTITLEMENT_PUBLIC_KEY = "GvAg4IZvAvBKgx3STrizOwtSLT62TYmMnny+xOq1FlI="
# When true the relay accepts sessions without an entitlement token. This is
# how local development runs before an issuer exists; it must never be set in
# production.
ALLOW_UNENTITLED = "false"
